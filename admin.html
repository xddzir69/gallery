<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #222; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  input[type=email], input[type=password], input[type=text] { width: 100%; padding: 10px; margin: 6px 0 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  button.danger { background: #dc2626; padding: 6px 10px; font-size: 13px; }
  button.ghost { background: #e5e7eb; color: #222; }
  button:disabled { opacity: .5; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .it { background: #fafafa; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
  .it img, .it video { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #000; }
  .it .meta { padding: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .it .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { font-size: 13px; color: #555; margin-top: 10px; white-space: pre-line; }
  .drop { border: 2px dashed #9ca3af; border-radius: 10px; padding: 24px; text-align: center; color: #666; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card" id="loginBox">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="loginErr" style="color:#dc2626;margin-top:8px"></div>
  </div>

  <div id="panel" hidden>
    <div class="card row">
      <h2 style="margin:0">Admin Panel</h2>
      <button class="ghost" id="logoutBtn">Logout</button>
    </div>

    <div class="card">
      <h3>Upload</h3>
      <div class="drop">
        <input type="file" id="files" accept="image/*,video/*" multiple>
        <p style="margin:8px 0 0">Ekshathe onek pic/video select kora jabe (max 50MB/file, free plan)</p>
      </div>
      <input type="text" id="titleIn" placeholder="Title / caption (optional, sob file e boshbe)" style="margin-top:12px">
      <button id="uploadBtn">Upload</button>
      <div id="log"></div>
    </div>

    <div class="card">
      <h3>Uploaded Media (<span id="count">0</span>)</h3>
      <div class="grid" id="list"></div>
    </div>
  </div>
</div>

<script>
const C = window.APP_CONFIG;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

async function refreshUI() {
  const { data: { session } } = await sb.auth.getSession();
  $("loginBox").hidden = !!session;
  $("panel").hidden = !session;
  if (session) loadList();
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) $("loginErr").textContent = error.message;
  else refreshUI();
};
$("logoutBtn").onclick = async () => { await sb.auth.signOut(); refreshUI(); };

async function loadList() {
  const { data, error } = await sb.from("media").select("*").order("created_at", { ascending: false });
  if (error) { alert(error.message); return; }
  $("count").textContent = data.length;
  $("list").innerHTML = "";
  data.forEach(m => {
    const d = document.createElement("div");
    d.className = "it";
    const media = m.type === "image"
      ? `<img loading="lazy" src="${m.url}">`
      : `<video muted preload="metadata" src="${m.url}#t=0.5"></video>`;
    d.innerHTML = `${media}<div class="meta"><span>${(m.title || m.type).replace(/</g, "&lt;")}</span><button class="danger">Delete</button></div>`;
    d.querySelector("button").onclick = () => del(m);
    $("list").appendChild(d);
  });
}

async function del(m) {
  if (!confirm("Delete korbe?")) return;
  await sb.storage.from(C.BUCKET).remove([m.path]);
  const { error } = await sb.from("media").delete().eq("id", m.id);
  if (error) alert(error.message);
  loadList();
}

$("uploadBtn").onclick = async () => {
  const files = [...$("files").files];
  if (!files.length) return alert("Age file select koro");
  const title = $("titleIn").value.trim();
  $("uploadBtn").disabled = true;
  $("log").textContent = "";
  let ok = 0;
  for (const [i, f] of files.entries()) {
    const type = f.type.startsWith("video") ? "video" : "image";
    const ext = f.name.split(".").pop().toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    $("log").textContent += `(${i + 1}/${files.length}) ${f.name} uploading...\n`;
    const { error: upErr } = await sb.storage.from(C.BUCKET).upload(path, f, { contentType: f.type, cacheControl: "31536000" });
    if (upErr) { $("log").textContent += `  ❌ ${upErr.message}\n`; continue; }
    const { data: pub } = sb.storage.from(C.BUCKET).getPublicUrl(path);
    const { error: dbErr } = await sb.from("media").insert({ title: title || null, type, url: pub.publicUrl, path });
    if (dbErr) { $("log").textContent += `  ❌ ${dbErr.message}\n`; continue; }
    ok++;
  }
  $("log").textContent += `\nDone: ${ok}/${files.length} uploaded ✅`;
  $("files").value = "";
  $("uploadBtn").disabled = false;
  loadList();
};

refreshUI();
</script>
</body>
</html>
