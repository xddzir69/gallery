<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js?v=7"></script>
<style>
  /* =================== Noir & Gold: tokens =================== */
  :root {
    --serif: "Playfair Display", "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --hi: #F0DDA6; --mid: #D4AF5F; --lo: #9C7A33; --onmetal: #1A1405;
    --metal: linear-gradient(135deg, var(--hi), var(--mid) 52%, var(--lo));
    --rose: #E58A98; --rose2: #F3B9C2; --danger: #E5726B; --ok: #5FCB95;
  }
  :root[data-mode="dark"] { --bg:#060608; --bg2:#0B0B0F; --card:#101015; --card2:#17171D; --line:rgba(255,255,255,.075); --line2:rgba(212,175,95,.28); --text:#F6F2E9; --mute:#8F8C97; --glass:rgba(10,10,14,.76); --shadow:0 26px 60px -22px rgba(0,0,0,.78); --glow:rgba(212,175,95,.11); --gold:#D4AF5F; color-scheme: dark; }
  :root[data-mode="light"] { --bg:#F8F4EA; --bg2:#F0EBDD; --card:#FFFDF7; --card2:#F6F1E3; --line:rgba(40,30,10,.1); --line2:rgba(156,122,43,.36); --text:#1B1710; --mute:#76705F; --glass:rgba(248,244,234,.82); --shadow:0 26px 50px -26px rgba(70,50,10,.3); --glow:rgba(212,175,95,.22); --gold:#8F6B1F; color-scheme: light; }

  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-bottom: calc(108px + env(safe-area-inset-bottom)); overflow-x: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(900px 520px at 50% -10%, var(--glow), transparent 70%), radial-gradient(700px 420px at 105% 105%, color-mix(in srgb, var(--mid) 7%, transparent), transparent 70%); }
  ::selection { background: color-mix(in srgb, var(--mid) 40%, transparent); }
  input, textarea { -webkit-user-select: text; user-select: text; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  img, video { -webkit-user-drag: none; }
  [hidden] { display: none !important; }
  .disp { font-family: var(--serif); font-weight: 500; letter-spacing: -.01em; }
  .mute { color: var(--mute); }
  .gold { color: var(--gold); }
  .i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .i.flip { transform: rotate(180deg); }
  .pre { white-space: pre-wrap; word-break: break-word; }
  @media print { body { display: none !important; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  /* ---------- splash / landing / age gate ---------- */
  #splash { position: fixed; inset: 0; z-index: 200; background: radial-gradient(700px 500px at 50% 35%, var(--glow), transparent 70%), var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .6s ease, visibility .7s; }
  #splash.done { opacity: 0; visibility: hidden; }
  #splash svg { width: 84px; height: 84px; overflow: visible; filter: drop-shadow(0 0 26px color-mix(in srgb, var(--mid) 55%, transparent)); animation: pulse 2.4s ease-in-out infinite; }
  #splash b { font-size: 13px; font-weight: 700; letter-spacing: .42em; text-transform: uppercase; padding-left: .42em; background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  .land { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 28px; gap: 8px; }
  .land svg { width: 84px; height: 84px; filter: drop-shadow(0 0 24px color-mix(in srgb, var(--mid) 45%, transparent)); }
  .land h1 { font-family: var(--serif); font-weight: 500; font-size: 36px; letter-spacing: -.02em; margin-top: 12px; }
  .land p { color: var(--mute); max-width: 30ch; margin-bottom: 18px; }
  .land small { color: var(--mute); margin-top: 16px; max-width: 34ch; }
  #agegate { position: fixed; inset: 0; z-index: 250; display: none; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(700px 500px at 50% 0%, var(--glow), transparent 70%), var(--bg); }
  #agegate.on { display: flex; }
  .ag { width: min(380px, 100%); text-align: center; }
  .ag svg.lg { display: block; width: 76px; height: 76px; margin: 0 auto 20px; filter: drop-shadow(0 0 24px color-mix(in srgb, var(--mid) 50%, transparent)); }
  .ag .age18 { display: inline-block; margin-bottom: 16px; padding: 5px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .24em; color: var(--gold); border: 1px solid var(--line2); }
  .ag h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; letter-spacing: -.02em; margin-bottom: 10px; }
  .ag p { color: var(--mute); font-size: 14.5px; line-height: 1.55; margin-bottom: 26px; }
  .ag .btn { margin-bottom: 10px; padding: 15px; } .ag small { display: block; margin-top: 12px; color: var(--mute); font-size: 11.5px; line-height: 1.5; }

  /* ---------- header + nav ---------- */
  header#top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--glass); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .brand svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--mid) 45%, transparent)); }
  .brand b { font-size: 12px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  :root[data-mode="light"] .brand b, :root[data-mode="light"] #splash b { background: linear-gradient(135deg, #B8862E, #7E5A16); -webkit-background-clip: text; background-clip: text; }
  .hbtn { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--card) 80%, transparent); }
  .hbtn .i { width: 19px; height: 19px; }
  .hbtn .dot { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-size: 10px; font-weight: 800; border: 2px solid var(--bg); background: var(--metal); color: var(--onmetal); }
  .hbtn.on { color: #FF7C9C; } .hbtn.on .i { fill: currentColor; }
  .back { display: inline-flex; align-items: center; gap: 2px; padding: 6px 10px 6px 2px; color: var(--gold); font-weight: 600; }
  #pgtitle { font-family: var(--serif); font-size: 19px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  main { max-width: 1120px; margin: 0 auto; }
  .pad { padding: 18px 16px 0; }
  nav { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(440px, calc(100% - 28px)); display: flex; padding: 7px; border-radius: 26px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05); }
  nav button { position: relative; flex: 1; padding: 9px 0 6px; border-radius: 18px; color: var(--mute); font-size: 10px; font-weight: 600; letter-spacing: .05em; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color .2s; }
  nav button.on { color: var(--gold); }
  nav button.on::before { content: ""; position: absolute; top: -8px; left: 50%; width: 24px; height: 3px; margin-left: -12px; border-radius: 0 0 5px 5px; background: var(--metal); box-shadow: 0 2px 16px var(--mid); }
  nav button.on .i { stroke-width: 2.1; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--mid) 55%, transparent)); }
  nav button .i { width: 21px; height: 21px; }
  .fab { position: fixed; z-index: 45; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 42px; height: 42px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: none; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  .fab.show { display: flex; }

  /* ---------- text, buttons, fields ---------- */
  .sec { font-family: var(--serif); font-weight: 500; font-size: 21px; letter-spacing: -.01em; margin: 6px 0 14px; display: flex; align-items: center; gap: 14px; }
  .sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); }
  .sec.nl::after { display: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 14px; background: var(--metal); color: var(--onmetal); font-weight: 700; font-size: 14.5px; letter-spacing: .01em; box-shadow: 0 12px 28px -12px color-mix(in srgb, var(--mid) 75%, transparent), inset 0 1px 0 rgba(255,255,255,.38); transition: transform .12s ease, filter .12s; }
  .btn:active { transform: scale(.97); filter: brightness(.95); }
  .btn.gh { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.gh:active { background: var(--card2); }
  .btn.sm { padding: 8px 14px; font-size: 13px; border-radius: 11px; }
  .btn.xs { padding: 6px 12px; font-size: 12px; border-radius: 10px; gap: 6px; }
  .btn.xs .i, .btn.sm .i { width: 15px; height: 15px; }
  .btn.block { width: 100%; }
  .btn.dg { background: var(--danger); color: #fff; box-shadow: none; }
  .btn.gh.dgt { color: var(--danger); }
  .btn:disabled { opacity: .5; }
  .btns { display: flex; gap: 10px; margin-top: 14px; } .btns .btn { flex: 1; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 13px; color: var(--mute); margin-bottom: 6px; }
  .field input, .field textarea, .field select { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; outline: none; }
  .field input:focus, .field textarea:focus, .code input:focus, .search input:focus, #sheet input:focus { border-color: var(--line2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mid) 14%, transparent); }
  .field textarea { min-height: 110px; resize: vertical; }
  .msg { text-align: center; color: var(--mute); padding: 56px 28px; line-height: 1.6; }
  .msg b { display: block; color: var(--text); font-family: var(--serif); font-weight: 500; font-size: 21px; margin-bottom: 6px; }
  .msg .btn { margin-top: 16px; }
  .skel { aspect-ratio: 3/4; border-radius: 18px; background: linear-gradient(100deg, var(--card) 30%, color-mix(in srgb, var(--mid) 9%, var(--card2)) 50%, var(--card) 70%); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .more { height: 40px; }
  .box { padding: 20px; border-radius: 22px; background: linear-gradient(165deg, var(--card2), var(--card)); border: 1px solid var(--line); box-shadow: 0 18px 40px -26px rgba(0,0,0,.8); margin-bottom: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--card2); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
  .pill .i { width: 12px; height: 12px; }
  .pill.g { background: color-mix(in srgb, var(--mid) 16%, transparent); color: var(--gold); box-shadow: inset 0 0 0 1px var(--line2); }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--gold); } .pill.bad { color: var(--danger); }
  .code { display: flex; gap: 10px; }
  .code input { flex: 1; min-width: 0; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: 600 16px var(--body); letter-spacing: .08em; text-transform: uppercase; outline: none; }
  .chipline { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chipline button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; color: var(--mute); }
  .chipline button.on { background: var(--metal); color: var(--onmetal); border-color: transparent; }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .seg button { padding: 7px 13px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--mute); }
  .seg button.on { background: var(--card2); color: var(--gold); box-shadow: inset 0 0 0 1px var(--line2); }
  .segw { display: flex; margin: 0 0 16px; } .segw .seg { width: 100%; } .segw .seg button { flex: 1; padding: 10px 0; }
  .switch { position: relative; width: 50px; height: 30px; border-radius: 30px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--line); flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: transform .2s ease; }
  .switch.on { background: var(--metal); } .switch.on::after { transform: translateX(20px); background: var(--onmetal); }
  .prog { height: 6px; border-radius: 6px; background: var(--card2); overflow: hidden; margin: 12px 0 8px; box-shadow: inset 0 0 0 1px var(--line); }
  .prog i { display: block; height: 100%; background: var(--metal); border-radius: 6px; transition: width .8s cubic-bezier(.2,.8,.2,1); }

  /* ---------- folder cards + slideshow ---------- */
  .grid { display: grid; gap: 14px 12px; }
  .grid.g2 { grid-template-columns: repeat(2, 1fr); }
  .grid.g3 { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid.list { grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid.g2 { grid-template-columns: repeat(3, 1fr); } .grid.g3 { grid-template-columns: repeat(5, 1fr); } }
  @media (min-width: 1100px) { .grid.g2 { grid-template-columns: repeat(4, 1fr); } .grid.g3 { grid-template-columns: repeat(6, 1fr); } }
  .it { position: relative; cursor: pointer; transition: transform .15s ease; min-width: 0; }
  .it:active { transform: scale(.975); }
  .th { position: relative; aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; background: linear-gradient(150deg, var(--card2), var(--bg2)); outline: 1px solid var(--line); outline-offset: -1px; box-shadow: 0 16px 30px -18px rgba(0,0,0,.7); isolation: isolate; }
  .g3 .th { aspect-ratio: 1; border-radius: 12px; }
  .ss { position: absolute; inset: 0; }
  .sl { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; background: center/cover no-repeat; }
  .sl.on { opacity: 1; }
  video.sl { background-color: #000; }
  .th::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.45), transparent 38%); pointer-events: none; z-index: 1; }
  .th .pl { position: absolute; z-index: 2; left: 8px; bottom: 8px; width: 24px; height: 24px; border-radius: 50%; background: rgba(6,6,8,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; display: none; align-items: center; justify-content: center; }
  .th[data-vid="1"] .pl { display: flex; }
  .th .pl .i { width: 11px; height: 11px; fill: currentColor; stroke: none; margin-left: 1px; }
  .th .abg { position: absolute; z-index: 2; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 999px; background: rgba(6,6,8,.58); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #F6F2E9; font-size: 11px; font-weight: 700; }
  .th .abg .i { width: 12px; height: 12px; stroke-width: 2; }
  .dots3 { position: absolute; z-index: 4; right: 7px; top: 7px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(6,6,8,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #F6F2E9; }
  .dots3 .i { width: 17px; height: 17px; }
  .dots3.on { color: #FF7C9C; }
  .hb { position: absolute; z-index: 4; right: 6px; top: 6px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(6,6,8,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #F6F2E9; }
  .hb .i { width: 14px; height: 14px; stroke-width: 2; }
  .hb.on { color: #FF7C9C; } .hb.on .i { fill: currentColor; }
  .cap { padding: 8px 3px 0; }
  .cap b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap span { color: var(--mute); font-size: 12px; }
  .g3 .cap b { font-size: 11.5px; } .g3 .cap span { display: none; }
  /* locked = 50% blur */
  .th.locked .sl { filter: blur(10px) saturate(1.1); transform: scale(1.2); }
  .th.locked::before { content: ""; position: absolute; inset: 0; z-index: 1; background: rgba(6,6,8,.32); }
  .lk { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .lkc { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(8,8,10,.55); border: 1px solid var(--line2); color: var(--hi); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .lkc .i { width: 18px; height: 18px; }
  .g3 .lkc { width: 30px; height: 30px; } .g3 .lkc .i { width: 14px; height: 14px; }
  /* tier colours (no text): lite = rose, expensive = golden glow */
  .t-lite .th { outline: 1.5px solid rgba(229,138,152,.7); outline-offset: -1.5px; background: linear-gradient(150deg, rgba(229,138,152,.22), var(--bg2)); box-shadow: 0 0 0 1px rgba(229,138,152,.18), 0 14px 30px -16px rgba(229,138,152,.5); }
  .t-expensive .th { outline: 1.5px solid var(--mid); outline-offset: -1.5px; background: linear-gradient(150deg, rgba(212,175,95,.22), var(--bg2)); box-shadow: 0 0 0 1px rgba(212,175,95,.4), 0 0 24px rgba(212,175,95,.5), 0 14px 34px -14px rgba(212,175,95,.55); animation: glow 3.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 1px rgba(240,221,166,.65), 0 0 34px rgba(240,200,110,.7), 0 14px 34px -14px rgba(212,175,95,.7); } }
  .fcard .th { box-shadow-origin: center; }
  .fcard:not(.t-lite):not(.t-expensive) .th { box-shadow: 0 -4px 0 -2px rgba(160,150,120,.26), 0 -8px 0 -4px rgba(160,150,120,.13), 0 16px 30px -18px rgba(0,0,0,.7); }

  /* ---------- home spotlight ---------- */
  .spot { margin: 0 -16px 26px; padding: 0 16px; }
  .sph { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .sph b { font-family: var(--serif); font-weight: 500; font-size: 22px; }
  .sph span { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  .spwrap { display: flex; gap: 12px; align-items: stretch; }
  .pinslot { position: relative; flex: 0 0 calc(50% - 6px); aspect-ratio: 3/4; }
  .pinslot.full { flex-basis: 100%; aspect-ratio: 16/10; }
  .pinslot .spc { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .8s ease; }
  .pinslot .spc.on { opacity: 1; pointer-events: auto; z-index: 2; }
  .strk { flex: 1; min-width: 0; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
  .strk::-webkit-scrollbar { display: none; }
  .strk .spc { flex: 0 0 100%; scroll-snap-align: start; aspect-ratio: 3/4; }
  .strk.two { flex: none; width: 100%; }
  .strk.two .spc { flex: 0 0 calc(50% - 6px); }
  .spc { position: relative; border-radius: 22px; overflow: hidden; text-align: left; cursor: pointer; background: var(--card); }
  .spc .th { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 22px; }
  .spc .shade { position: absolute; inset: 0; z-index: 2; background: linear-gradient(to top, rgba(0,0,0,.78), transparent 58%); pointer-events: none; }
  .spc .smeta { position: absolute; z-index: 3; left: 14px; right: 14px; bottom: 14px; color: #fff; pointer-events: none; }
  .spc .smeta b { display: block; font-family: var(--serif); font-weight: 500; font-size: 19px; line-height: 1.12; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .spc .smeta span { display: block; margin-top: 3px; font-size: 12px; opacity: .78; }
  .spc.hasunl .smeta { bottom: 52px; }
  .stag { position: absolute; z-index: 3; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; background: var(--metal); color: var(--onmetal); font-size: 9.5px; font-weight: 800; letter-spacing: .12em; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .stag.pop { background: rgba(8,8,10,.6); color: var(--hi); border: 1px solid rgba(240,221,166,.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

}

/* ---------- folder preview flow ----------
   Every folder changes its picture every 5 seconds, but one after another: the 1st visible folder at second 0,
   the 2nd one second later, the 3rd one second after that... (a wave, not everything at once).
   All pictures of a folder are loaded in the background first, so a flip never waits for the network. */
let ssTick = 0;
const ssPrime = ss => { [...ss.children].forEach(c => { if (c.dataset.src && c.tagName === "IMG") { c.src = c.dataset.src; c.removeAttribute("data-src"); } }); };
const ssReady = el => !el || el.tagName === "DIV" || (el.tagName === "IMG" ? (el.complete && el.naturalWidth > 0) : (el.readyState >= 2));
function ssPlay(ss) {
  const cur = ss.children[+ss.dataset.i];
  [...ss.children].forEach(c => { if (c.tagName === "VIDEO" && c !== cur && !c.paused) c.pause(); });
  if (cur && cur.tagName === "VIDEO" && cur.paused) { const p = cur.play(); if (p && p.catch) p.catch(() => {}); }
}
function ssFlip(ss) {
  const n = +ss.dataset.n; if (n < 2) return;
  const sl = ss.children, i = +ss.dataset.i;
  for (let step = 1; step < n; step++) {
    const j = (i + step) % n, nx = sl[j]; if (!nx) continue;
    if (nx.dataset.src) { nx.src = nx.dataset.src; nx.removeAttribute("data-src"); if (nx.tagName === "VIDEO") nx.preload = "auto"; }
    if (!ssReady(nx)) { if (nx.tagName === "VIDEO" && nx.readyState < 2 && step === 1 && (ss._w = (ss._w || 0) + 1) < 3) return; continue; }

    if (ss.parentElement) ss.parentElement.dataset.vid = nx.dataset.v ? "1" : "";
    return;
  }
}
setInterval(() => {
  if (document.hidden) return;
  ssTick++;
  const vis = [];
  document.querySelectorAll(".ss").forEach(ss => {
    const r = ss.getBoundingClientRect();
    if (r.bottom > -700 && r.top < innerHeight + 900) ssPrime(ss);
    if (r.bottom > -40 && r.top < innerHeight + 40) vis.push(ss);
    else { const c = ss.children[+ss.dataset.i]; if (c && c.tagName === "VIDEO" && !c.paused) c.pause(); }
  });
  vis.forEach((ss, k) => { ssPlay(ss); if (k % 5 === ssTick % 5) ssFlip(ss); });
}, 1000);

const thumbsOf = m => (m.thumbs && m.thumbs.length) ? m.thumbs : [{ type: m.type || "image", url: null, preview: m.preview || null, locked: !!m.locked }];
function slidesHTML(list, locked) {
  return `<div class="ss" data-n="${list.length}" data-i="0">${list.map((t, k) => {
    const on = k === 0 ? " on" : "", v = t.type === "video" ? ' data-v="1"' : "";
    const pv = pvCss(t.preview);
    if (locked || t.locked || !t.url) return `<div class="sl${on}"${v} style="${pv}"></div>`;
    const key = k ? "data-src" : "src";
    /* videos always play as a real muted preview (the small stored picture is only the backdrop until the first frame shows) */
    if (t.type === "video") return `<video class="sl${on}" data-v="1" muted loop playsinline webkit-playsinline preload="${k ? "none" : "auto"}" style="${pv}" ${key}="${esc(t.url)}#t=0.5"></video>`;
    return `<img class="sl${on}" draggable="false" alt="" decoding="async" style="${pv}" ${key}="${esc(t.url)}">`;
  }).join("")}</div>`;
}

    <div class="th ${m.locked ? "locked" : ""}" data-vid="${vidAttr(th)}">${slidesHTML(th, m.locked)}${m.locked ? lockHTML : ""}${playHTML}<span class="abg">${ic("folder")}${m.count || 0}</span>
      ${!m.locked || src === "saved" ? `<button class="dots3 ${favs.has(m.id) ? "on" : ""}" data-act="menu" data-src="${src}" data-i="${i}" data-id="${m.id}" aria-label="More">${ic("dots")}</button>` : ""}</div>
    <div class="cap"><b>${esc(m.title || "Folder")}</b><span>${countMeta(m)}</span></div></div>`;

/* ---------- infinite list ---------- */
function mountList(el, o) {
  const S = { page: 0, busy: false, done: false, t: 0, grid: null };
  el.innerHTML = `<div class="feedbox"></div><div class="msg" hidden></div><div class="more"></div>`;
  const [box, msg, more] = el.children; SRC[o.src] = [];
  const io = new IntersectionObserver(en => { if (en[0].isIntersecting) load(); }, { rootMargin: "700px" }); observers.push(io);
  const ren = o.render || itemHTML;
  function add(items) {
    items.forEach(m => {
      const idx = SRC[o.src].push(m) - 1;
      if (!S.grid) { box.innerHTML = `<div class="grid ${o.grid || "g2"}"></div>`; S.grid = box.firstElementChild; }
      S.grid.insertAdjacentHTML("beforeend", ren(m, idx, o.src));
    });
  }
  async function load() {
    if (S.busy || S.done) return; S.busy = true; const t = S.t;
    if (!S.page) box.innerHTML = `<div class="grid ${o.grid || "g2"}">${Array.from({ length: 4 }, () => '<div class="skel"></div>').join("")}</div>`;
    try {
      const r = await o.fetch(S.page + 1, 24); if (t !== S.t) return;
      if (!S.page) { box.innerHTML = ""; S.grid = null; }
      S.page++; o.onData?.(r); add(r.items);
      // the server hides empty or not-yet-published folders, so a page can come back empty while more pages still exist
      const seen = S.page * 24 >= (r.total || 0);
      S.done = SRC[o.src].length >= r.total || (!r.items.length && seen);
      if (!S.done && !r.items.length) { S.busy = false; return load(); }
      if (!SRC[o.src].length) { msg.hidden = false; msg.innerHTML = o.empty || "<b>Nothing here yet</b>New posts will appear here."; }
    } catch (e) { if (t !== S.t) return; box.innerHTML = ""; msg.hidden = false; msg.innerHTML = `<b>Couldn't load</b>${esc(e.message)}`; S.done = true; }
    S.busy = false;
  }
  io.observe(more); load();
  return { reload() { S.t++; S.page = 0; S.done = false; S.busy = false; S.grid = null; SRC[o.src] = []; msg.hidden = true; box.innerHTML = ""; load(); } };
}
const gridHTML = (arr, src, grid) => `<div class="grid ${grid}">${arr.map((m, i) => itemHTML(m, i, src)).join("")}</div>`;

  ["touchstart", "pointerdown"].forEach(e => tr.addEventListener(e, () => pause = Date.now() + 9000, { passive: true }));

    const step = cards[0].offsetWidth + 12;

async function uploadSigned(u, blob, type) {

})();

/* ---------- support chat ---------- */
let tkCat = "other";
const TKS = { open: "Open", answered: "Replied", closed: "Closed" };
const TK_INFO = `<div class="tinfo"><b>How it works:</b> first write a short <b>subject</b>, then your message. We reply here like a chat. You can write in English or in বাংলা (Bangla). A chat can't be deleted, only we can close it.</div>`;
PAGES.tickets = async function () {
  app.innerHTML = `<div class="pad">${TK_INFO}<button class="btn block" data-act="go" data-r="ticketnew" style="margin-bottom:18px">${ic("plus")}New message</button><div id="tl"><div class="skel" style="aspect-ratio:4/1"></div></div></div>`;
  const r = await api("ticket_list");
  $("tl").innerHTML = r.items.length ? r.items.map(t => `<button class="tk" data-act="go" data-r="ticket" data-p='{"id":"${t.id}"}'><span class="ic">${ic("ticket")}</span><span class="tb"><b>${esc(t.subject)}</b><span class="m"><span class="pill ${t.status === "answered" ? "g" : ""}">${TKS[t.status] || t.status}</span><span>${esc(t.category)}</span><span>${ago(t.updated_at)}</span></span></span>${ic("next", "mute")}</button>`).join("")
    : `<div class="msg"><b>No chats yet</b>Start a message if you need any help.</div>`;
};
PAGES.ticketnew = async function (p) {
  tkCat = p?.category || "other";
  app.innerHTML = `<div class="pad">${TK_INFO}<div class="chipline">${[["payment", "Payment"], ["premium", "Premium"], ["problem", "Problem"], ["other", "Other"]].map(([v, l]) => `<button class="${tkCat === v ? "on" : ""}" data-act="tkcat" data-v="${v}">${l}</button>`).join("")}</div>
    <label class="field"><span>1. Subject</span><input id="ts" maxlength="80" value="${esc(p?.subject || "")}" placeholder="What do you need help with?"></label>
    <label class="field"><span>2. Your message</span><textarea id="tb" maxlength="1000" placeholder="Write here... (English or বাংলা)">${esc(p?.body || "")}</textarea></label>
    <button class="btn block" data-act="tkcreate">Send</button></div>`;
};
ACT.tkcat = (d, el) => { document.querySelectorAll("[data-act=tkcat]").forEach(b => b.classList.toggle("on", b === el)); tkCat = d.v; };
ACT.tkcreate = async () => {
  try { const r = await api("ticket_create", { subject: $("ts").value, body: $("tb").value, category: tkCat }); haptic("medium"); stack.pop(); stack.push({ r: "tickets", p: {} }); nav("ticket", { id: r.id }); }
  catch (e) { toast(e.message); }
};
PAGES.ticket = async function (p) {
  let last = "";
  const msgsHTML = r => `<div class="hd"><b>${esc(r.ticket.subject)}</b>${TKS[r.ticket.status]} · ${esc(r.ticket.category)}</div>${r.messages.map(m => `<div class="bub ${m.from_admin ? "" : "me"} pre">${esc(m.body)}<small>${m.from_admin ? esc(r.admin_name || "Support") + " · " : ""}${ago(m.created_at)}</small></div>`).join("")}`;
  const first = await api("ticket_get", { id: p.id }), closed = first.ticket.status === "closed";
  app.innerHTML = `<div class="pad"><div class="chat" id="chat"></div></div>${closed ? `<div class="chatclosed">This chat was closed by support. Start a new message if you need more help.</div>` : `<div class="chatbar"><div class="in"><textarea id="rt" rows="1" maxlength="1000" placeholder="Write a message..."></textarea><button class="btn" data-act="tkreply" aria-label="Send">${ic("send")}</button></div></div>`}`;
  $("nav").hidden = true;
  const draw = (r, scroll) => { const html = msgsHTML(r); if (html === last) return; last = html; $("chat").innerHTML = html; if (scroll) window.scrollTo(0, document.body.scrollHeight); };
  draw(first, true);
  timers.push(setInterval(async () => { if (stack[stack.length - 1].r !== "ticket") return; try { const r = await api("ticket_get", { id: p.id }); const atEnd = innerHeight + scrollY >= document.body.scrollHeight - 120; draw(r, atEnd); } catch {} }, 8000));
  ACT._tkdraw = draw;
};
ACT.tkreply = async () => {
  const el = $("rt"), v = el.value.trim(); if (!v) return; const id = stack[stack.length - 1].p.id; el.disabled = true;
  try { await api("ticket_reply", { id, body: v }); el.value = ""; haptic("light"); const r = await api("ticket_get", { id }); ACT._tkdraw?.(r, true); } catch (e) { toast(e.message); }
  el.disabled = false; el.focus();
};

/* ---------- settings ---------- */
PAGES.settings = async function () {

ACT.haptics = () => { prefs.haptics = !prefs.haptics; savePrefs(); haptic("light"); PAGES.settings(); };

ACT.notify = async () => {

/* ---------- notifications ---------- */
const KIND = { post: ["image", "New post"], premium: ["crown", "Premium"], notice: ["notice", "Notice"], ticket: ["ticket", "Support"], custom: ["bell", "Update"] };
let nfItems = [];
PAGES.notifs = async function () {

  const r = await api("notif_list"); nfItems = r.items;

    : `<div class="msg"><b>No notifications</b>New posts and rewards will show up here.</div>`;

};
ACT.nfopen = d => {
  const n = nfItems.find(x => x.id === d.id); if (!n) return; haptic("light");
  if (n.kind === "premium") return nav("plans", n.code ? { code: 1, prefill: n.code } : {});
  if (n.kind === "ticket") return nav("tickets"); if (n.kind === "post") return nav("home");
};

/* ---------- viewer (pinch zoom, swipe, no download) ---------- */
const V = { list: [], i: 0, fs: false, z: 1, x: 0, y: 0 };
const vpt = new Map(); let vg = null, lastTap = 0, tapT = 0;
function tryFS(v) {
  try { const f = v.requestFullscreen || v.webkitRequestFullscreen || v.webkitEnterFullscreen; const r = f?.call(v); r?.catch?.(() => {}); } catch {}
  if (!V.fs) { try { tg?.requestFullscreen?.(); V.fs = true; } catch {} }
}
function openViewer(list, idx) {
  const id = list[idx]?.id;
  V.list = list.filter(x => !x.locked && x.url);
  V.i = Math.max(0, V.list.findIndex(x => x.id === id));
  if (!V.list.length) return;
  $("viewer").classList.add("open"); $("viewer").classList.remove("bare"); $("vsheet").classList.remove("on"); syncBack(); drawViewer();
}
function setT(anim) { const im = $("vimg"); if (!im) return; im.style.transition = anim ? "transform .25s ease" : "none"; im.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.z})`; }
function clampPan() {
  const im = $("vimg"); if (!im || V.z <= 1) { V.x = V.y = 0; return; }
  const mx = Math.max(0, (im.clientWidth * V.z - innerWidth) / 2), my = Math.max(0, (im.clientHeight * V.z - innerHeight) / 2);
  V.x = Math.min(mx, Math.max(-mx, V.x)); V.y = Math.min(my, Math.max(-my, V.y));
}
const vName = m => m.kind === "comm" || m.kind === "mine" ? [m.label, m.title].filter(Boolean).join(" · ") : (m.label || "");
function drawViewer() {
  const m = V.list[V.i]; if (!m) return; V.z = 1; V.x = V.y = 0; vpt.clear();
  const vid = m.type === "video";
  $("viewer").classList.toggle("vid", vid); $("viewer").classList.toggle("mine", m.kind === "mine" || m.kind === "comm");
  $("vheart").hidden = m.kind !== "media";
  $("stage").style.touchAction = vid ? "auto" : "none";
  if (vid) {
    $("stage").innerHTML = `<video src="${esc(m.url)}" controls controlslist="nodownload noremoteplayback" disablepictureinpicture disableremoteplayback playsinline autoplay></video>`;
    const v = $("stage").firstElementChild; v.oncontextmenu = e => e.preventDefault();
    v.addEventListener("loadedmetadata", () => tryFS(v), { once: true }); tryFS(v); v.play?.().catch(() => {});
  } else $("stage").innerHTML = `<img id="vimg" draggable="false" src="${esc(m.url)}" alt="">`;
  $("vcnt").textContent = `${V.i + 1} / ${V.list.length}`;
  $("vt").textContent = vName(m); $("vm").textContent = (m.created_at ? fmtDate(m.created_at) : "") + (m.kind === "media" ? `  ·  ${short(m.views)} views` : m.kind === "comm" && m.by ? `  ·  by ${m.by}` : "");
  $("vheart").classList.toggle("on", favs.has(m.id));
  $("vp").hidden = V.i === 0; $("vn").hidden = V.i === V.list.length - 1;
  if (m.kind === "media") api("view", { media_id: m.id }).catch(() => {});
  pingScreen(true);
  if ($("vsheet").classList.contains("on")) drawInfo();
}
function drawInfo() {
  const m = V.list[V.i]; if (!m) return;
  const row = (a, b) => `<div class="ir"><span>${a}</span><span>${b}</span></div>`;
  $("vsheet").innerHTML = `${vName(m) ? `<h3>${esc(vName(m))}</h3>` : `<h3>Details</h3>`}${row("Type", m.type === "video" ? "Video" : "Photo")}${m.created_at ? row("Added", fmtDate(m.created_at)) : ""}${m.kind === "media" ? row("Views", short(m.views)) : ""}`;
}
function step(d) { const n = V.i + d; if (n < 0 || n >= V.list.length) return; V.i = n; haptic("light"); drawViewer(); }
function closeViewer() {
  $("viewer").classList.remove("open"); setTimeout(() => pingScreen(true), 0); $("stage").innerHTML = ""; $("vsheet").classList.remove("on");
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch {}
  if (V.fs) { try { tg?.exitFullscreen?.(); } catch {} V.fs = false; } syncBack();
}
$("vclose").onclick = closeViewer; $("vp").onclick = () => step(-1); $("vn").onclick = () => step(1);
$("vheart").onclick = () => { const m = V.list[V.i]; if (m) toggleFav(m.id, "media"); };
$("vinfo").onclick = () => { const s = $("vsheet"); if (!s.classList.contains("on")) drawInfo(); s.classList.toggle("on"); };
(function () {
  const st = $("stage"), pd = () => { const [a, b] = [...vpt.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const isVid = () => V.list[V.i]?.type === "video";
  st.addEventListener("pointerdown", e => {
    if (isVid()) return; st.setPointerCapture(e.pointerId); vpt.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (vpt.size === 1) vg = { sx: e.clientX, sy: e.clientY, t: Date.now(), x0: V.x, y0: V.y, dx: 0, dy: 0 };
    if (vpt.size === 2 && vg) { vg.d0 = pd(); vg.z0 = V.z; }
  });
  st.addEventListener("pointermove", e => {
    const p = vpt.get(e.pointerId); if (!p || !vg) return; p.x = e.clientX; p.y = e.clientY;
    if (vpt.size === 2) { V.z = Math.min(5, Math.max(1, vg.z0 * pd() / vg.d0)); clampPan(); setT(false); return; }
    vg.dx = e.clientX - vg.sx; vg.dy = e.clientY - vg.sy;
    if (V.z > 1) { V.x = vg.x0 + vg.dx; V.y = vg.y0 + vg.dy; clampPan(); setT(false); }
    else { V.x = vg.dx * .8; V.y = Math.max(0, vg.dy) * .8; setT(false); }
  });
  const end = e => {
    if (!vpt.has(e.pointerId)) return; vpt.delete(e.pointerId); if (vpt.size || !vg) return;
    const { dx, dy, t } = vg, quick = Date.now() - t < 280, tap = Math.abs(dx) < 8 && Math.abs(dy) < 8 && quick;
    if (V.z > 1.02) { if (V.z < 1.08) V.z = 1; clampPan(); setT(true); }
    else if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.2) { V.z = 1; V.x = V.y = 0; step(dx < 0 ? 1 : -1); }
    else if (dy > 110 && dy > Math.abs(dx)) closeViewer();
    else {
      V.z = 1; V.x = V.y = 0; setT(true);
      if (tap) {
        const now = Date.now();
        if (now - lastTap < 300) { clearTimeout(tapT); lastTap = 0; V.z = 2.6; V.x = -(e.clientX - innerWidth / 2) * 1.6; V.y = -(e.clientY - innerHeight / 2) * 1.6; clampPan(); setT(true); }
        else { lastTap = now; tapT = setTimeout(() => $("viewer").classList.toggle("bare"), 290); }
      }
    }
    vg = null;
  };
  st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
  st.addEventListener("wheel", e => { if (isVid()) return; e.preventDefault(); V.z = Math.min(5, Math.max(1, V.z * (e.deltaY < 0 ? 1.15 : .87))); clampPan(); setT(true); }, { passive: false });
})();
document.addEventListener("keydown", e => { if (!$("viewer").classList.contains("open")) return; if (e.key === "Escape") closeViewer(); if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); });

/* ---------- landscape popup (5 seconds, Copy button for codes) ---------- */
let popN = null, popT = 0;
function showPopup(n) {
  popN = n; const k = KIND[n.kind] || KIND.custom, sec = Math.min(10, Math.max(3, Number(settings.popup_seconds) || 5));
  const box = $("popbox"); box.style.setProperty("--dur", sec + "s");
  box.innerHTML = `<div class="pi2">${ic(k[0])}</div>
    <div class="pb2"><div class="kd">${ic("crown", "")}${k[1]}</div><h3>${esc(n.title)}</h3>${n.body ? `<p>${esc(n.body)}</p>` : ""}${n.code ? `<div class="pcode"><code>${esc(n.code)}</code><button class="btn xs" data-act="copy" data-t="${esc(n.code)}">${ic("copy")}Copy</button></div>` : ""}</div>
    <button class="x" data-act="popclose" aria-label="Close">${ic("close")}</button><i class="bar"></i>`;
  $("popup").classList.add("open"); haptic("medium"); clearTimeout(popT); popT = setTimeout(closePopup, sec * 1000);
}
function closePopup() {
  clearTimeout(popT); $("popup").classList.remove("open");
  if (popN && unread) { unread = 0; drawBell(); api("notif_seen").catch(() => {}); } popN = null;
}
ACT.popclose = () => closePopup();
ACT.popgo = () => { const n = popN; closePopup(); if (!n) return; if (n.kind === "premium") nav("plans", n.code ? { code: 1, prefill: n.code } : {}); else if (n.kind === "ticket") nav("tickets"); else nav("notifs"); };

/* ---------- start ---------- */
function endSplash() { setTimeout(() => $("splash").classList.add("done"), 1500); }
function landing() {
  $("top").hidden = true; $("nav").hidden = true;
  app.innerHTML = `<div class="land"><svg><use href="#logo"/></svg><h1>${esc(C.APP_TITLE)}</h1><p>Log in with Telegram to view the collection.</p><div id="tgw"></div><small>We only read your Telegram name and photo. No password needed.</small></div>`;
  const s = document.createElement("script"); s.async = true; s.src = "https://telegram.org/js/telegram-widget.js?22";
  s.dataset.telegramLogin = C.BOT_USERNAME; s.dataset.size = "large"; s.dataset.radius = "14"; s.dataset.requestAccess = "write"; s.dataset.onauth = "onTgAuth(user)";
  $("tgw").appendChild(s);
}
window.onTgAuth = u => { LS.set("gv_web", u); location.reload(); };
function ageCheck() {
  return new Promise(res => {
    if (LS.get("gv_age", "") === "1") return res();
    $("agegate").classList.add("on");
    $("ageYes").onclick = () => { LS.set("gv_age", "1"); $("agegate").classList.remove("on"); haptic("medium"); res(); };
    $("ageNo").onclick = () => { try { if (tg?.close) return tg.close(); } catch {} $("agegate").querySelector("h1").textContent = "Come back when you're 18"; $("agegate").querySelector("p").textContent = "You can close this window now."; $("ageYes").hidden = true; $("ageNo").hidden = true; };
  });
}
(async function init() {
  await ageCheck();
  if (!inTg && !webAuth) { landing(); return endSplash(); }
  try {
    const r = await api("init");
    me = r.me; cats = r.categories || []; plans = r.plans || []; settings = r.settings || {}; unread = r.unread || 0; favs = new Set(r.favs || []);
    const st = Date.parse(r.server_time); if (!isNaN(st)) clockSkew = st - Date.now();
    render(); openDeepLink();
    if (r.popup) setTimeout(() => showPopup(r.popup), 1500);
  } catch (e) {
    if (!inTg && !webAuth) landing();
    else { $("top").hidden = true; $("nav").hidden = true; app.innerHTML = `<div class="land"><svg><use href="#logo"/></svg><h1>${/maintenance|back/i.test(e.message) ? "Be right back" : "Couldn't load"}</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`; }
  }
  endSplash();
})();
</script>
